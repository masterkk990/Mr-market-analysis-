<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AUTO LIVE</title><style>body{margin:0;background:#0f172a;color:#fff;font-family:sans-serif;padding:10px}.card{max-width:400px;margin:auto;background:#1e293b;border-radius:16px;padding:12px;border:1px solid #334155}#log{font-size:9px;background:#000;color:#0f0;padding:8px;border-radius:8px;height:90px;overflow:auto;margin-top:8px;white-space:pre-wrap}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px}.grid div{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:4px;text-align:center;font-size:11px}.big{border:2px solid #22c55e;border-radius:14px;padding:12px;background:#052e16;margin-top:10px}</style></head><body>
<div class="card">
<b>AUTO LIVE - NO BUTTON</b> <span id="dot" style="color:#fbbf24">● STARTING</span>
<div id="log">Starting...\n</div>
<div class="big"><div style="display:flex;gap:10px;align-items:center"><div id="dig" style="width:60px;height:60px;background:#fff;color:#000;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900">-</div><div><div id="conf" style="font-size:22px;font-weight:900">--%</div><div id="info" style="font-size:9px">waiting live ticks</div></div><div style="margin-left:auto;text-align:right"><div id="pr">--</div><div id="last" style="font-size:18px;font-weight:800">-</div></div></div><div id="trade" style="margin-top:8px;background:#fbbf24;color:#000;padding:6px;border-radius:8px;text-align:center;font-weight:800;font-size:11px">Initializing...</div></div>
<div class="grid" id="grid"></div>
<div id="ticks" style="display:flex;flex-wrap:wrap;gap:2px;background:#0f172a;padding:6px;border-radius:8px;margin-top:8px;min-height:40px"></div>
</div>
<script>
let logEl=document.getElementById('log');
function L(m){logEl.innerText+=m+"\n"; logEl.scrollTop=9999; console.log(m);}
window.onerror=(msg,src,line)=>{L("JS ERROR: "+msg+" line "+line);};
let ticks=[],prices=[];
function getD(s){return parseInt(s.toString().slice(-1));}
function analyze(){
 if(ticks.length<5) return;
 let c=Array(10).fill(0);ticks.forEach(d=>c[d]++);
 let exp=ticks.length/10,std=Math.sqrt(ticks.length*0.09)||3;
 let zs=c.map(x=>(x-exp)/std),maxZ=Math.max(...zs),hot=zs.indexOf(maxZ);
 let conf=10+maxZ*1.8;conf=Math.max(9,Math.min(19,conf));
 document.getElementById('dig').innerText=hot;
 document.getElementById('conf').innerText=conf.toFixed(1)+"% REAL LIVE";
 document.getElementById('info').innerText=`Z:${maxZ.toFixed(2)} ${c[hot]}/${ticks.length} LIVE R_100`;
 document.getElementById('trade').innerText=`LIVE TRADE ${hot} MATCHES Z=${maxZ.toFixed(2)}`;
 document.getElementById('pr').innerText=prices[0].toFixed(3);
 document.getElementById('last').innerText=ticks[0];
 let g="";c.forEach((x,i)=>{let h=i==hot;g+=`<div style="${h?'border-color:#22c55e;background:#052e16':''}"><b>${i}</b><br>${x}<br>Z:${zs[i].toFixed(1)}</div>`});
 document.getElementById('grid').innerHTML=g;
 let t="";ticks.slice(0,50).forEach(d=>{let h=d==hot; t+=`<span style="width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;font-size:10px;font-weight:700;margin:1px;${h?'background:#22c55e;color:#000':'background:#1e293b;color:#888;border:1px solid #334155'}">${d}</span>`});
 document.getElementById('ticks').innerHTML=t;
}
L("WARP check: "+navigator.onLine);
try{
 L("Connecting WSS to ws.derivws.com...");
 let ws=new WebSocket("wss://ws.derivws.com/websockets/v3?app_id=1089");
 ws.onopen=()=>{L("✓ WSS OPEN! Requesting history..."); document.getElementById('dot').innerText="● CONNECTED"; document.getElementById('dot').style.color="#22c55e"; ws.send(JSON.stringify({ticks_history:"R_100",count:100,end:"latest",style:"ticks"}));};
 ws.onmessage=(e)=>{
  let d=JSON.parse(e.data);
  if(d.history){L("✓ Got "+d.history.prices.length+" LIVE TICKS from Deriv!"); d.history.prices.forEach(p=>{let pr=parseFloat(p); ticks.push(getD(p)); prices.push(pr);}); ticks.reverse(); prices.reverse(); ticks=ticks.slice(0,100); prices=prices.slice(0,100); analyze(); L("Subscribing to live stream..."); ws.send(JSON.stringify({ticks:"R_100",subscribe:1}));}
  if(d.tick){let pr=parseFloat(d.tick.quote); let dg=getD(d.tick.quote); ticks.unshift(dg); if(ticks.length>100) ticks.pop(); prices.unshift(pr); if(prices.length>100) prices.pop(); analyze(); document.getElementById('dot').innerText="● LIVE "+pr.toFixed(2);}
 };
 ws.onerror=(e)=>{L("✗ WSS ERROR - WARP OFF? Turn WARP ON! "+e);};
 ws.onclose=()=>{L("WSS closed. If no ticks, WARP OFF or battery saver ON");};
}catch(err){L("CRITICAL ERROR: "+err.message);}
setTimeout(()=>{if(ticks.length==0) L("Still 0 ticks after 5s → 1) WARP must show 🔑 key icon 2) Charge phone 3) Use Firefox not Chrome");},5000);
</script></body></html>
